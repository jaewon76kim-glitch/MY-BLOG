<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3GPP UE 프로토콜 스펙 지도</title>
  <meta name="description" content="LTE/NR 단말 프로토콜 개발자가 봐야 하는 3GPP 스펙을 프로토콜 스택 구조 위에 배치한 지도">
  <link rel="stylesheet" href="css/style.css?v=20260801e">

<div class="wrap">

  <main id="view"></main>
